name: Full AI Code Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited] # Allows you to type @github-actions /fix or /review manually

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write # Required if you want it to suggest code fixes
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Run Qodo Merge (PR Agent)
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.DEEPSEEK_KEY }}
          OPENAI.BASE_URL: "https://api.deepseek.com/v1"
          CONFIG.MODEL: "deepseek-chat"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Automate the Full Agent Capabilities
          github_action_config.auto_describe: "true"  # Context check
          github_action_config.auto_review: "true"    # Deep code review
          github_action_config.auto_improve: "true"   # Bug fixes & optimizations