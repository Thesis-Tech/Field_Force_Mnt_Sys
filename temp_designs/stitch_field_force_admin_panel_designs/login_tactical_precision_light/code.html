<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ForceAdmin</title>
<!-- Tailwind CSS with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#b7c4ff",
                        "tertiary-container": "#bf3003",
                        "on-surface": "#131b2e",
                        "primary": "#003ec7",
                        "surface-container-highest": "#dae2fd",
                        "error-container": "#ffdad6",
                        "primary-container": "#0052ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dde1ff",
                        "surface-container-low": "#f2f3ff",
                        "surface-bright": "#faf8ff",
                        "inverse-on-surface": "#eef0ff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-container": "#54647a",
                        "error": "#ba1a1a",
                        "surface-dim": "#d2d9f4",
                        "inverse-surface": "#283044",
                        "secondary": "#505f76",
                        "on-primary-fixed-variant": "#0038b6",
                        "on-tertiary-fixed": "#3c0800",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#dae2fd",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eaedff",
                        "background": "#faf8ff",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#d0e1fb",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb4a1",
                        "on-tertiary-fixed-variant": "#891e00",
                        "on-tertiary-container": "#ffddd5",
                        "surface-tint": "#004ced",
                        "outline-variant": "#c3c5d9",
                        "on-surface-variant": "#434656",
                        "secondary-fixed": "#d3e4fe",
                        "on-background": "#131b2e",
                        "tertiary": "#952200",
                        "on-primary-fixed": "#001452",
                        "surface": "#faf8ff",
                        "on-primary-container": "#dfe3ff",
                        "surface-container-high": "#e2e7ff",
                        "outline": "#737688",
                        "inverse-primary": "#b7c4ff",
                        "tertiary-fixed": "#ffdbd2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-max": "1440px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Base typography enforcement */
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Card Surface -->
<div class="w-full max-w-[400px] bg-surface-container-lowest border border-outline-variant p-8 md:p-10 flex flex-col gap-8 shadow-sm">
<!-- Branding Identity -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 bg-primary-container text-on-primary-container flex items-center justify-center rounded-none shadow-inner border border-primary">
<span class="material-symbols-outlined" data-icon="dashboard" style="font-size: 32px;">dashboard</span>
</div>
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">ForceAdmin</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Precision Operations</p>
</div>
</div>
<!-- Authentication Form -->
<form action="#" class="flex flex-col gap-5" method="POST" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide" for="email">Operator ID / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person" style="font-size: 20px;">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all rounded-none" id="email" name="email" placeholder="operator@forceadmin.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide" for="password">Security Clearance Key</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors border-b border-transparent hover:border-primary" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="key" style="font-size: 20px;">key</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all rounded-none" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-3 font-label-caps text-label-caps hover:bg-on-primary-fixed-variant focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all rounded-none mt-4 flex items-center justify-center gap-2 group" type="submit">
                Sign In
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- System Footer -->
<div class="border-t border-surface-container-highest pt-6 mt-2 text-center flex flex-col gap-2">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-tertiary" data-icon="shield" style="font-size: 14px;">shield</span>
                Secure connection established
            </p>
<p class="font-body-md text-body-md text-outline-variant text-[11px] leading-tight">
                Authorized personnel only. All access is logged and monitored.
            </p>
</div>
</div>
</body></html>
